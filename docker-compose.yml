services:
  db:
    image: postgres:16-alpine
    container_name: pdv_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdv_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-pdv_restaurante}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdv_user} -d ${POSTGRES_DB:-pdv_restaurante}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Gestor visual de base de datos Web (Adminer)
  adminer:
    image: adminer:latest
    container_name: pdv_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdv_backend
    restart: unless-stopped
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=${POSTGRES_USER:-pdv_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pdv_secret_password}
      - POSTGRES_DB=${POSTGRES_DB:-pdv_restaurante}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - SECRET_KEY=${SECRET_KEY:-supersecretkey_change_me_in_production_xyz123}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pdv_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
